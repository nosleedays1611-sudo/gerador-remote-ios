<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>Rafaela - Generator Remote iOS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    width:100%;
    min-height:100%;
    background:#000;
    overscroll-behavior-y:none;
}

body{
    width:100%;
    min-height:100%;
    margin:0;

    background:#000;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;
    overscroll-behavior-y:none;

    -webkit-text-size-adjust:100%;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================================
   FUNDO FIXO
========================================================= */

#fixedBackground{
    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    overflow:hidden;

    z-index:0;

    background:#000;

    pointer-events:none;

    transform:translateZ(0);
}

#particles{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;
}

.page{
    position:relative;

    z-index:1;

    width:100%;
    min-height:100vh;
    min-height:100dvh;
}


/* =========================================================
   LOGIN
========================================================= */

.login-screen{
    width:100%;

    min-height:100vh;
    min-height:100svh;

    display:grid;
    place-items:center;

    padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
}

.login-content{
    width:100%;
    max-width:430px;

    margin:auto;

    text-align:center;
}


/* =========================================================
   LOGO
========================================================= */

.logo{
    position:relative;

    display:grid;
    place-items:center;

    width:64px;
    height:64px;

    margin:0 auto 14px;

    border:1px solid #202020;

    border-radius:18px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 62% 35%,
            #ececec 0 8%,
            #7d7d7d 9%,
            #181818 29%,
            #050505 64%
        );

    box-shadow:
        0 0 26px
        rgba(255,255,255,.07);
}

.logo::before{
    content:"";

    position:absolute;

    width:30px;
    height:9px;

    left:17px;
    top:24px;

    border-radius:50%;

    background:#e9e9e9;

    transform:rotate(-8deg);

    box-shadow:
        inset 0 -3px 5px #666;
}

.logo::after{
    content:"";

    position:absolute;

    width:6px;
    height:6px;

    left:30px;
    top:26px;

    border-radius:50%;

    background:#111;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.55);
}

.logo span{
    position:absolute;

    width:2px;
    height:23px;

    left:32px;
    top:31px;

    background:
        linear-gradient(
            #d62442,
            transparent
        );

    transform:rotate(4deg);

    opacity:.8;
}


/* =========================================================
   HEADER LOGIN
========================================================= */

.small-title{
    margin-bottom:13px;

    color:#666;

    font-size:10px;
    font-weight:800;

    letter-spacing:2px;
}

.main-title{
    margin-bottom:11px;

    font-size:34px;
    line-height:1;

    font-weight:900;

    letter-spacing:-1.5px;
}

.description{
    max-width:360px;

    margin:
        0 auto
        27px;

    color:#626262;

    font-size:14px;
    font-weight:600;

    line-height:1.45;
}


/* =========================================================
   CARDS / FIELDS
========================================================= */

.login-card,
.panel{
    background:
        rgba(11,11,11,.96);

    border:
        1px solid
        #292929;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.72);
}

.login-card{
    width:100%;

    padding:20px;

    border-radius:20px;

    text-align:left;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;

    margin-bottom:6px;

    color:#707070;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.7px;
}

.field input,
.field select{
    width:100%;
    height:45px;

    padding:0 14px;

    border:
        1px solid
        #292929;

    border-radius:11px;

    outline:none;

    background:#020202;
    color:#f5f5f5;

    font-size:13px;
}

.field input::placeholder{
    color:#363636;
}

.field input:focus,
.field select:focus{
    border-color:#4b4b4b;
}


/* =========================================================
   BOTÕES
========================================================= */

.login-button,
.main-button{
    width:100%;
    height:46px;

    border:0;

    border-radius:11px;

    background:#f4f4f4;
    color:#080808;

    font-size:14px;
    font-weight:900;
}

.login-button:hover,
.main-button:hover{
    background:#fff;
}

.small-button{
    width:auto;
    min-height:34px;

    padding:0 12px;

    border:
        1px solid
        #303030;

    border-radius:9px;

    background:#121212;
    color:#bbb;

    font-size:10px;
    font-weight:800;
}

.small-button:hover{
    background:#1a1a1a;
}

.login-error{
    display:block;

    min-height:17px;

    margin-top:9px;

    color:#a84949;

    font-size:11px;

    text-align:center;
}

.support{
    margin-top:20px;

    color:#414141;

    font-size:10px;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard{
    width:100%;
    min-height:100vh;
    min-height:100dvh;

    padding:
        max(34px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(60px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
}

.dashboard-wrap{
    width:100%;
    max-width:1180px;

    margin:auto;
}

.dashboard-header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:16px;

    margin-bottom:26px;
}

.dashboard-brand{
    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;
}

.mini-logo{
    flex:0 0 auto;

    display:grid;
    place-items:center;

    width:42px;
    height:42px;

    border:
        1px solid
        #292929;

    border-radius:12px;

    background:#101010;

    font-size:17px;
    font-weight:900;
}

.dashboard-brand h1{
    font-size:21px;
    font-weight:900;
}

.dashboard-brand p{
    margin-top:3px;

    color:#555;

    font-size:9px;
    font-weight:800;

    letter-spacing:1.6px;
}

.logout{
    width:auto;
    height:38px;

    padding:0 16px;

    border:
        1px solid
        #292929;

    border-radius:10px;

    background:#0d0d0d;
    color:#aaa;

    font-size:12px;
    font-weight:700;
}


/* =========================================================
   GRID
========================================================= */

.dashboard-grid{
    display:grid;

    grid-template-columns:
        320px
        minmax(0,1fr);

    gap:17px;
}

.panel{
    min-width:0;

    padding:20px;

    border-radius:19px;
}

.panel-top{
    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    gap:15px;

    margin-bottom:20px;
}

.panel-tag{
    color:#555;

    font-size:9px;
    font-weight:900;

    letter-spacing:2px;
}

.panel h2{
    margin-top:4px;

    font-size:19px;
}

.online{
    color:#555;

    font-size:9px;
    font-weight:800;

    letter-spacing:1px;
}

.online::before{
    content:"";

    display:inline-block;

    width:5px;
    height:5px;

    margin-right:5px;

    border-radius:50%;

    background:#aaa;
}


/* =========================================================
   GERADOR / COPIAR
========================================================= */

.generated-head{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-top:14px;
}

.generated-title{
    color:#555;

    font-size:9px;
    font-weight:900;

    letter-spacing:1.4px;
}

.generator-output{
    min-height:87px;

    margin-top:8px;
    padding:12px;

    border:
        1px solid
        #222;

    border-radius:11px;

    background:#020202;
    color:#777;

    font-family:
        Consolas,
        monospace;

    font-size:11px;

    white-space:pre-wrap;

    word-break:break-all;
}


/* =========================================================
   FILTROS / BULK
========================================================= */

.filters{
    display:grid;

    grid-template-columns:
        minmax(150px,1fr)
        125px
        90px;

    gap:7px;

    margin-bottom:10px;
}

.filters input,
.filters select{
    width:100%;
    min-width:0;
    height:39px;

    padding:0 11px;

    border:
        1px solid
        #282828;

    border-radius:9px;

    outline:none;

    background:#020202;
    color:#aaa;

    font-size:11px;
}

.refresh{
    height:39px;

    border:
        1px solid
        #292929;

    border-radius:9px;

    background:#111;
    color:#bbb;

    font-size:11px;
    font-weight:700;
}

.bulk-bar{
    display:flex;

    justify-content:space-between;
    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:12px;

    padding:
        9px
        10px;

    border:
        1px solid
        #222;

    border-radius:10px;

    background:#080808;
}

.bulk-left{
    display:flex;

    align-items:center;

    gap:9px;

    color:#777;

    font-size:10px;
}

.check{
    width:15px;
    height:15px;

    accent-color:#f4f4f4;
}


/* =========================================================
   TABELA
========================================================= */

.table-wrap{
    width:100%;

    overflow:auto;

    border:
        1px solid
        #202020;

    border-radius:11px;

    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:860px;
}

thead{
    background:#080808;
}

th{
    padding:
        11px
        9px;

    color:#555;

    font-size:9px;
    font-weight:800;

    text-align:left;

    letter-spacing:1px;

    white-space:nowrap;
}

td{
    padding:
        10px
        9px;

    border-top:
        1px solid
        #202020;

    color:#999;

    font-size:11px;

    vertical-align:middle;
}

td strong{
    color:#ddd;

    word-break:break-all;
}

.status{
    display:inline-block;

    padding:
        3px
        7px;

    border:
        1px solid
        #303030;

    border-radius:20px;
}

.action{
    padding:
        5px
        7px;

    margin:
        2px;

    border:
        1px solid
        #292929;

    border-radius:7px;

    background:#111;
    color:#aaa;

    font-size:9px;

    white-space:nowrap;
}

.action:hover{
    background:#1a1a1a;
}

.result-count{
    color:#444;

    font-size:10px;
}


/* =========================================================
   TOAST
========================================================= */

#toast{
    display:none;

    position:fixed;

    left:50%;
    bottom:
        max(
            22px,
            env(safe-area-inset-bottom)
        );

    z-index:9999;

    max-width:
        calc(100vw - 32px);

    padding:
        11px
        16px;

    border-radius:10px;

    background:#f5f5f5;
    color:#050505;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.7);

    font-size:12px;
    font-weight:800;

    text-align:center;

    transform:
        translateX(-50%);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:720px){

    .login-screen{
        min-height:100svh;

        align-items:center;

        padding:
            max(20px, env(safe-area-inset-top))
            20px
            max(26px, env(safe-area-inset-bottom));
    }

    .login-content{
        max-width:380px;
    }

    .dashboard{
        padding:
            max(22px, env(safe-area-inset-top))
            14px
            max(40px, env(safe-area-inset-bottom));
    }

    .dashboard-wrap{
        max-width:100%;
    }

    .dashboard-header{
        margin-bottom:20px;
    }

    .dashboard-grid{
        display:flex;

        flex-direction:column;

        gap:14px;
    }

    .panel{
        width:100%;

        padding:17px;

        border-radius:17px;
    }

    .filters{
        display:flex;

        flex-direction:column;

        gap:8px;
    }

    .filters input,
    .filters select,
    .refresh{
        width:100%;
        height:42px;
    }

    .bulk-bar{
        align-items:flex-start;

        flex-direction:column;
    }

    .table-wrap{
        overflow:visible;

        border:0;
    }

    table{
        display:block;

        width:100%;
        min-width:0;
    }

    thead{
        display:none;
    }

    tbody{
        display:flex;

        flex-direction:column;

        gap:10px;
    }

    tr{
        display:block;

        width:100%;

        padding:
            4px
            13px;

        border:
            1px solid
            #252525;

        border-radius:13px;

        background:#080808;
    }

    td{
        display:grid;

        grid-template-columns:
            88px
            minmax(0,1fr);

        align-items:center;

        gap:10px;

        width:100%;

        padding:
            10px
            0;

        border-top:
            1px solid
            #1d1d1d;

        font-size:11px;

        word-break:break-word;
    }

    td:first-child{
        border-top:0;
    }

    td::before{
        content:
            attr(data-label);

        color:#525252;

        font-size:8px;
        font-weight:900;

        letter-spacing:1.2px;
    }

    td.select-cell{
        display:flex;

        justify-content:space-between;
    }

    td.actions-cell{
        display:block;
    }

    td.actions-cell::before{
        display:block;

        margin-bottom:8px;
    }

    .action{
        display:inline-flex;

        align-items:center;
        justify-content:center;

        min-height:31px;

        margin:
            2px
            3px
            2px
            0;

        padding:
            6px
            9px;
    }
}
</style>
</head>


<body>

    <canvas id="particles"></canvas>
</div>


<div class="page">

</div>

<script>
/* =========================================================
   BACKGROUND
========================================================= */

const canvas =
    document.getElementById(
        "particles"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let particles = [];

let canvasWidth = 0;
let canvasHeight = 0;
let previousWidth = 0;


function setupCanvas(
    force = false
){

    const width =
        document.documentElement
            .clientWidth;

    const height =
        Math.max(
            window.innerHeight,
            document.documentElement
                .clientHeight
        );


    if(
        !force &&
        Math.abs(
            width -
            previousWidth
        ) < 20
    ){

        return;

    }


    previousWidth =
        width;


    const dpr =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );


    canvasWidth =
        width;

    canvasHeight =
        height;


    canvas.width =
        Math.round(
            canvasWidth *
            dpr
        );


    canvas.height =
        Math.round(
            canvasHeight *
            dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    createParticles();

}



function createParticles(){

    particles = [];


    const amount =
        Math.max(
            28,
            Math.floor(
                canvasWidth /
                24
            )
        );


    for(
        let i = 0;
        i < amount;
        i++
    ){

        particles.push({

            x:
                Math.random() *
                canvasWidth,

            y:
                Math.random() *
                canvasHeight,

            vx:
                (
                    Math.random() -
                    .5
                ) *
                .08,

            vy:
                (
                    Math.random() -
                    .5
                ) *
                .08,

            r:
                Math.random() *
                .9 +
                .35

        });

    }

}



function animateParticles(){

    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    for(
        const p of particles
    ){

        p.x +=
            p.vx;

        p.y +=
            p.vy;


        if(
            p.x < 0 ||
            p.x > canvasWidth
        ){

            p.vx *=
                -1;

        }


        if(
            p.y < 0 ||
            p.y > canvasHeight
        ){

            p.vy *=
                -1;

        }


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI *
            2
        );


        ctx.fillStyle =
            "rgba(255,255,255,.70)";


        ctx.fill();

    }


    for(
        let i = 0;
        i < particles.length;
        i++
    ){

        for(
            let j = i + 1;
            j < particles.length;
            j++
        ){

            const a =
                particles[i];

            const b =
                particles[j];


            const distance =
                Math.hypot(
                    a.x - b.x,
                    a.y - b.y
                );


            if(
                distance <
                105
            ){

                const opacity =
                    (
                        1 -
                        distance /
                        105
                    ) *
                    .17;


                ctx.beginPath();


                ctx.moveTo(
                    a.x,
                    a.y
                );


                ctx.lineTo(
                    b.x,
                    b.y
                );


                ctx.strokeStyle =
                    `rgba(255,255,255,${opacity})`;


                ctx.lineWidth =
                    .7;


                ctx.stroke();

            }

        }

    }


    requestAnimationFrame(
        animateParticles
    );

}

const $ =

        document.querySelector(
            selector
        );


let token =
    localStorage.getItem(
        "rafaela_token"
    ) || "";

function toast(
    message
){

    const element =
        $("#toast");


    element.textContent =
        message;


    element.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                element.style.display =
                    "none";

            },
            2200
        );

}



async function copyText(
    text
){

    try{

        await navigator.clipboard
            .writeText(text);

    }
    catch{

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body
            .appendChild(
                textarea
            );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();

    }

}



/* =========================================================
   API
========================================================= */

async function api(
    url,
    options = {}
){

    options.headers = {

        ...(options.headers || {}),

        "Content-Type":
            "application/json"

    };


    if(
        token
    ){

        options.headers.Authorization =
            "Bearer " +
            token;

    }


    const response =
        await fetch(
            url,
            options
        );


    const data =
        await response
        .json()
        .catch(
            () => ({})
        );


    if(
        response.status === 401 &&
        url !==
        "/api/admin/login"
    ){

        logout();


        throw new Error(
            "Sessão expirada"
        );

    }


    if(
        !response.ok
    ){

        throw new Error(
            data.message ||
            data.error ||
            "Erro"
        );

    }


    return data;

}

/* =========================================================
   FORMATAÇÃO
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        character =>
            ({

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#39;"

            })[
                character
            ]
    );

}



function formatDate(
    timestamp
){

    if(
        !timestamp
    ){

        return "—";

    }


    return new Date(
        Number(timestamp)
    )
    .toLocaleString(
        "pt-BR"
    );

}



function updateSelectionUi(){

    const size =
        selectedKeys.size;


    $("#selectedCount")
        .textContent =
        size +
        " selecionada(s)";


    $("#copySelected")
        .disabled =
        size === 0;


    const checkboxes =
        [
            ...document
                .querySelectorAll(
                    ".key-check"
                )
        ];


    $("#selectAll")
        .checked =
        checkboxes.length > 0 &&
        checkboxes.every(
            checkbox =>
                checkbox.checked
        );

}



/* =========================================================
   LISTAR KEYS
========================================================= */

async function loadKeys(){

    try{


        const params =
            new URLSearchParams();


        if(
            $("#search")
                .value
        ){

            params.set(
                "q",
                $("#search")
                    .value
            );

        }


        if(
            $("#status")
                .value
        ){

            params.set(
                "status",
                $("#status")
                    .value
            );

        }


        const data =
            await api(
                "/api/keys?" +
                params
            );


        selectedKeys.clear();


        $("#selectAll")
            .checked =
            false;


        $("#resultCount")
            .textContent =
            data.keys.length +
            " resultado(s)";


        $("#rows")
            .innerHTML =
            data.keys
            .map(
                key =>
`
<tr>

    <td
        data-label="SELECIONAR"
        class="select-cell"
    >

        <input
            class="check key-check"
            type="checkbox"
            value="${escapeHTML(
                key.license_key
            )}"
        >

    </td>


    <td data-label="KEY">

        <strong>
            ${escapeHTML(
                key.license_key
            )}
        </strong>

    </td>


    <td data-label="PLANO">

        ${escapeHTML(
            key.plan
        )}

    </td>


    <td data-label="STATUS">

        <span class="status">

            ${escapeHTML(
                key.status
            )}

        </span>

    </td>


    <td data-label="EXPIRA">

        ${formatDate(
            key.expires_at
        )}

    </td>


    <td data-label="IPV4">

        ${
            key.bound_ipv4
                ?
                escapeHTML(
                    key.bound_ipv4
                )
                :
                "—"
        }

    </td>


    <td
        data-label="AÇÕES"
        class="actions-cell"
    >

        ${
            key.status ===
            "active"

            ?

`
<button
    class="action"
    onclick="keyAction(
        '${key.license_key}',
        'pause'
    )"
>
    Pausar
</button>
`

            :

            ""
        }


        ${
            key.status ===
            "paused"

            ?

`
<button
    class="action"
    onclick="keyAction(
        '${key.license_key}',
        'resume'
    )"
>
    Retomar
</button>
`

            :

            ""
        }


        <button
            class="action"
            onclick="resetIpv4(
                '${key.license_key}'
            )"
        >
            Reset IPv4
        </button>


        <button
            class="action"
            onclick="resetKey(
                '${key.license_key}'
            )"
        >
            Reset key
        </button>


        <button
            class="action"
            onclick="addHours(
                '${key.license_key}'
            )"
        >
            + Horas
        </button>


        ${
            key.status ===
            "disabled"

            ?

`
<button
    class="action"
    onclick="keyAction(
        '${key.license_key}',
        'enable'
    )"
>
    Ativar
</button>
`

            :

`
<button
    class="action"
    onclick="keyAction(
        '${key.license_key}',
        'disable'
    )"
>
    Desativar
</button>
`
        }


        <button
            class="action"
            onclick="deleteKey(
                '${key.license_key}'
            )"
        >
            Excluir
        </button>

    </td>

</tr>
`
            )
            .join("");


        document
            .querySelectorAll(
                ".key-check"
            )
            .forEach(
                checkbox => {

                    checkbox
                        .addEventListener(
                            "change",
                            () => {

                                if(
                                    checkbox.checked
                                ){

                                    selectedKeys.add(
                                        checkbox.value
                                    );

                                }
                                else{

                                    selectedKeys.delete(
                                        checkbox.value
                                    );

                                }


                                updateSelectionUi();

                            }
                        );

                }
            );


        updateSelectionUi();


    }
    catch(
        error
    ){


        toast(
            error.message
        );


    }

}



/* =========================================================
   MULTISELECT / COPIAR
========================================================= */

$("#selectAll")
.onchange =
() => {


    const checked =
        $("#selectAll")
            .checked;


    selectedKeys.clear();


    document
        .querySelectorAll(
            ".key-check"
        )
        .forEach(
            checkbox => {

                checkbox.checked =
                    checked;


                if(
                    checked
                ){

                    selectedKeys.add(
                        checkbox.value
                    );

                }

            }
        );


    updateSelectionUi();

};



$("#copySelected")
.onclick =
async () => {


    if(
        selectedKeys.size ===
        0
    ){

        return;

    }


    await copyText(
        [
            ...selectedKeys
        ]
        .join(
            "\n"
        )
    );


    toast(
        selectedKeys.size +
        " key(s) copiadas"
    );

};

window.addHours =
async key => {


    const answer =
        prompt(
            "Quantas horas deseja adicionar?"
        );


    if(
        answer ===
        null
    ){

        return;

    }


    const hours =
        Number(answer);


    if(
        !Number.isFinite(hours) ||
        hours <= 0
    ){

        toast(
            "Quantidade de horas inválida"
        );

        return;

    }


    try{


        await api(

            "/api/keys/" +
                encodeURIComponent(
                    key
                ) +
                "/add-hours",

            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        hours
                    })
            }

        );


        toast(
            `${hours} hora(s) adicionada(s)`
        );


        loadKeys();


    }
    catch(
        error
    ){


        if(
            error.message ===
            "lifetime_key"
        ){

            toast(
                "Essa key é lifetime"
            );

            return;

        }


        toast(
            error.message
        );


    }

};



window.deleteKey =
async key => {


    if(
        !confirm(
            "Excluir " +
            key +
            "?"
        )
    ){

        return;

    }


    try{


        await api(

            "/api/keys/" +
            encodeURIComponent(
                key
            ),

            {
                method:
                    "DELETE"
            }

        );


        toast(
            "Key excluída"
        );


        loadKeys();


    }
    catch(
        error
    ){


        toast(
            error.message
        );


    }

};
